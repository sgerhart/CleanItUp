name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle app
        run: ./scripts/bundle.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: CleanItUp
          path: build/CleanItUp.dmg
          if-no-files-found: error
